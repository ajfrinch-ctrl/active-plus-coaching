<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512">
  <!-- Green brush-style circle -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#006400" stroke-width="13" 
          stroke-linecap="round" opacity="0.95"/>
  
  <!-- Black brush-style A (using path for more hand-drawn look) -->
  <path d="M 52 148 
           Q 70 50 88 40 
           Q 100 35 112 45 
           L 148 148 
           M 72 105 
           L 128 105" 
        fill="none" 
        stroke="#1a1a1a" 
        stroke-width="15" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Red brush-style + -->
  <path d="M 145 65 
           L 145 120 
           M 120 92 
           L 170 92" 
        fill="none" 
        stroke="#e53935" 
        stroke-width="13" 
        stroke-linecap="round"/>
</svg>
